<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mod Paketi İndir</title>
    <style>
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background-color: #111215;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .box {
            text-align: center;
            background: #18191d;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.3);
            border: 1px solid #282a32;
            max-width: 400px;
        }
        h2 { margin-bottom: 8px; color: #fff; }
        p { color: #8a8d98; font-size: 14px; margin-bottom: 25px; }
        .btn {
            background: #4f46e5;
            color: white;
            border: none;
            padding: 14px 28px;
            font-size: 15px;
            font-weight: 600;
            border-radius: 6px;
            cursor: pointer;
            transition: background 0.2s;
            width: 100%;
        }
        .btn:hover { background: #4338ca; }
        #log { margin-top: 15px; font-size: 13px; color: #34d399; }
    </style>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
</head>
<body>

    <div class="box">
        <h2>Mod Klasörünü İndir</h2>
        <p>Butona tıkladığınızda 'mods' klasörü içindeki tüm modlarla birlikte bilgisayarınıza inecektir.</p>
        
        <button class="btn" id="indirBtn">Modları İndir</button>
        <div id="log"></div>
    </div>

    <script>
        document.getElementById('indirBtn').addEventListener('click', async () => {
            const logDiv = document.getElementById('log');
            logDiv.style.color = "#34d399";
            logDiv.innerText = "Modlar hazırlanıyor...";

            const zip = new JSZip();
            // Zip içinde "mods" adında TEK BİR klasör oluşturuyoruz
            const hedefKlasor = zip.folder("mods");

            // 2. mods klasörünün içindeki dosyaların listesi. 
            // Kendi dosya isimlerine göre burayı düzenle!
            const dosyalar = [
                'apple-skin.jar',
                'balm.jar',
                'fabric-api.jar',
                'geckolib.jar',
                'jei.jar',
                'journeymap.jar',
                'sodium.jar',
                'voicechat.jar',
                'waystones.jar',
            ];

            try {
                for (const dosya of dosyalar) {
                    // Sunucudan çekerken yol: mods/mods/dosya_adi.jar
                    const response = await fetch(`mods/mods/${dosya}`);
                    
                    if (!response.ok) {
                        throw new Error(`${dosya} dosyası kaynakta bulunamadı.`);
                    }
                    
                    const blob = await response.blob();
                    // Zip içindeki tek bir "mods" klasörünün içine dosyayı ekliyoruz
                    hedefKlasor.file(dosya, blob);
                }

                logDiv.innerText = "Klasör paketleniyor...";

                // Zip dosyasını sıkıştır ve indir
                const zipIcerik = await zip.generateAsync({ type: "blob" });
                saveAs(zipIcerik, "mods.zip");

                logDiv.innerText = "İndirme tamamlandı!";
                setTimeout(() => logDiv.innerText = "", 3000);

            } catch (hata) {
                console.error(hata);
                logDiv.style.color = "#ef4444";
                logDiv.innerText = "Hata: " + hata.message;
            }
        });
    </script>

</body>
</html>
